<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感谢老师</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #fff8f0;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .card {
      text-align: center;
      padding: 40px 60px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .emoji { font-size: 60px; }
    .msg   { font-size: 32px; font-weight: bold; color: #e07b5a; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">💐</div>
    <div class="msg">老师辛苦了！</div>
  </div>
</body>
</html>
